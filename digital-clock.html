<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #1F2335;
    --lime: #8CC63F;
    --lime-soft: #E6F3D3;
    --muted: #7A7F8E;
  }
  @media (prefers-color-scheme: dark) {
    :root { --navy: #EDEEF2; --muted: #9AA0AE; --lime-soft: rgba(140,198,63,0.28); }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: transparent; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 8px;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    color: var(--navy);
  }
  .card {
    width: 100%; max-width: 520px;
    container-type: inline-size;
    padding: 8px 12px;
  }
  .top {
    display: flex; justify-content: flex-end; align-items: center;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
  }
  .live { display: flex; align-items: center; gap: 6px; color: var(--navy); }
  .led {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--lime);
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: 0.25; } }

  .time {
    display: flex; align-items: baseline; justify-content: center;
    gap: 0.15em;
    margin: 6px 0 8px;
    font-weight: 800;
    font-size: clamp(40px, 19cqi, 92px);
    line-height: 1;
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }
  .colon { color: var(--lime); }
  .sec {
    font-size: 0.32em; font-weight: 700;
    color: var(--muted);
    margin-left: 0.25em;
    min-width: 2ch;
  }
  .date {
    text-align: center;
    font-size: clamp(11px, 3.2cqi, 14px);
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .date b {
    color: var(--navy); font-weight: 700;
    background: linear-gradient(transparent 55%, var(--lime-soft) 55%);
    padding: 0 2px;
  }
</style>
</head>
<body>
  <div class="card" role="timer" aria-live="off">
    <div class="top">
      <span class="live"><span class="led"></span>LIVE</span>
    </div>

    <div class="time" aria-label="현재 시각">
      <span id="hh">00</span><span class="colon">:</span><span id="mm">00</span><span class="sec" id="ss">00</span>
    </div>

    <div class="date" id="date"></div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const DAYS = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

  function tick() {
    const now = new Date();
    $("hh").textContent = pad(now.getHours());
    $("mm").textContent = pad(now.getMinutes());
    $("ss").textContent = pad(now.getSeconds());

    $("date").innerHTML =
      `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} · <b>${DAYS[now.getDay()]}</b>`;
  }

  tick();
  setTimeout(() => { tick(); setInterval(tick, 1000); }, 1000 - (Date.now() % 1000));
</script>
</body>
</html>
